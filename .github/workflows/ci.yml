name: CivicConnect M3 CI & Quality Gate

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-verify-gate:
    name: Build, Static/Security, Tests, Staging & Perf Gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install Cleanly from Lockfile
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: 4. Static Code & Security/Secrets Check
        working-directory: ./backend
        run: npm run check

      - name: 5. Automated Unit, Integration & System Tests (35 Tests)
        working-directory: ./backend
        run: npm test

      - name: 6. Simulated Staging E2E & Backup Verification
        working-directory: ./backend
        run: npm run staging:verify

      - name: 7. Performance & Workload Smoke Test
        working-directory: ./backend
        run: npm run perf